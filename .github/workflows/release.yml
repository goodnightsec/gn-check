name: Release

# Cut a release by pushing a semver tag, e.g.:
#   git tag v0.6.0 && git push origin v0.6.0
#
# Tag first: the images are pushed under the exact version tag and sha-*, then
# scanned. Only a green scan adds the moving tags (X.Y, latest), publishes the
# provenance and SBOM attestations, and creates the draft GitHub release. A
# failed scan leaves the exact-version images public (the tag is never reused)
# and needs a patch release; no floating tag or GitHub release is created.
#
# workflow_dispatch is a rehearsal: it builds, scans and attests with the given
# pre-release version and never creates a release.
#
# Images are intended to be public (anonymous docker pull of
# ghcr.io/<owner>/gn-check-{backend,scanner}:<version-tag> works). Visibility is
# a one-time GHCR package setting, not something this workflow controls — GHCR
# creates a package private on first push, so flip it again if a new package
# name ever appears (third image, repo rename). `packages: write` is still
# required to push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Pre-release version for the rehearsal (e.g. v0.0.0-rehearsal)"
        required: true
        default: "v0.0.0-rehearsal"
        type: string

permissions:
  contents: read

jobs:
  # Gate the release on a green test run so a tag can never ship untested code.
  test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check pinned upstream scanner versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-scanner-versions.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  images:
    name: Build, scan & record ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: deploy/Dockerfile.backend
            skip_upstream: "false"
          - name: scanner
            dockerfile: deploy/Dockerfile.scanner
            skip_upstream: "true"
    env:
      # Pinned scanner and vulnerability DB. Refresh both before each release
      # (see AGENTS.md). The scanner-versions check enforces the bundled
      # nuclei/naabu pins.
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
      TRIVY_DB: ghcr.io/aquasecurity/trivy-db@sha256:5d198796df48756a646f0d71f5c75fc8477681376f3fd052fca6b05b0cc29939
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU covers any target-arch execution during the build. The Go/SPA/nuclei
      # stages are pinned to BUILDPLATFORM (no emulation), but keep this so the
      # arm64 leg still works if a future stage adds a target-arch RUN.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
            case "$tag" in
              *-*) ;;
              *)
                echo "workflow_dispatch needs a pre-release version, e.g. v0.0.0-rehearsal" >&2
                exit 1
                ;;
            esac
          else
            tag="$GITHUB_REF_NAME"
          fi
          case "$tag" in
            v*) ;;
            *)
              echo "Version must start with v: $tag" >&2
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=${tag#v}" >> "$GITHUB_OUTPUT"

      # metadata-action lowercases the image name (GHCR requires lowercase).
      # Push only the exact version and sha; the moving tags are added after the
      # scan passes. Labels: GitHub's license detection reports AGPL-3.0; the
      # project is AGPL-3.0-or-later. A custom label replaces the generated one.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.image }}
            type=sha
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub attestations are created by the attest job. Do not add
          # BuildKit's own provenance/SBOM attestations as well.
          provenance: false
          sbom: false
          # ref_name is the git tag, including the leading v; sha is the full
          # commit. Both images stamp them into their binary. An unstamped build
          # must not invent a release tag.
          build-args: |
            VERSION_TAG=${{ steps.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan both platforms
        shell: bash
        run: |
          set -u
          image="ghcr.io/${{ github.repository }}-${{ matrix.name }}"
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p artifacts "$RUNNER_TEMP/trivy-cache"
          status=0
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            common=(image --image-src remote --platform "$platform" --scanners vuln
              --severity HIGH,CRITICAL --db-repository "$TRIVY_DB" --format json)
            # The scanner image's gate skips the bundled nuclei/naabu binaries.
            # They are upstream's responsibility; the scanner-versions check
            # enforces the newest releases. The full scan still lists them.
            skip=()
            if [ "${{ matrix.skip_upstream }}" = "true" ]; then
              skip=(--skip-files /usr/local/bin/nuclei --skip-files /usr/local/bin/naabu)
            fi
            # Gate: high/critical with a fix, after the skip, stop the workflow.
            # Findings without a fix do not block (SVT-6).
            docker run --rm \
              -v "$PWD:/workspace" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              -w /workspace \
              -e TRIVY_USERNAME="${{ github.actor }}" \
              -e TRIVY_PASSWORD="${{ github.token }}" \
              "$TRIVY_IMAGE" "${common[@]}" "${skip[@]}" \
              --ignore-unfixed \
              --exit-code 1 \
              --output "artifacts/gate-${{ matrix.name }}-${arch}.json" \
              "$image@$digest" || status=1
            # Full scan: the run summary and the release notes must name the
            # findings without a fix. This report is not a gate.
            docker run --rm \
              -v "$PWD:/workspace" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              -w /workspace \
              -e TRIVY_USERNAME="${{ github.actor }}" \
              -e TRIVY_PASSWORD="${{ github.token }}" \
              "$TRIVY_IMAGE" "${common[@]}" \
              --output "artifacts/full-${{ matrix.name }}-${arch}.json" \
              "$image@$digest" || status=1
          done
          python3 scripts/trivy-release-check.py \
            --name "${{ matrix.name }}" \
            --full "artifacts/full-${{ matrix.name }}-"*.json \
            --gate "artifacts/gate-${{ matrix.name }}-"*.json \
            --scanner-pin "$TRIVY_IMAGE" \
            --db-pin "$TRIVY_DB" \
            --out "artifacts/findings-${{ matrix.name }}.md" || status=$?
          exit "$status"

      - name: Generate SBOMs
        run: |
          image="ghcr.io/${{ github.repository }}-${{ matrix.name }}"
          digest="${{ steps.build.outputs.digest }}"
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            docker run --rm \
              -v "$PWD:/workspace" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              -w /workspace \
              -e TRIVY_USERNAME="${{ github.actor }}" \
              -e TRIVY_PASSWORD="${{ github.token }}" \
              "$TRIVY_IMAGE" image \
              --image-src remote \
              --platform "$platform" \
              --scanners vuln \
              --db-repository "$TRIVY_DB" \
              --format cyclonedx \
              --output "artifacts/sbom-${{ matrix.name }}-${arch}.cdx.json" \
              "$image@$digest"
          done

      - name: Record digests and checksums
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository }}-${{ matrix.name }}"
          digest="${{ steps.build.outputs.digest }}"
          version="${{ steps.version.outputs.image }}"
          docker buildx imagetools inspect "$image@$digest" --raw \
            > "artifacts/index-${{ matrix.name }}.json"
          amd64=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "artifacts/index-${{ matrix.name }}.json")
          arm64=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' "artifacts/index-${{ matrix.name }}.json")
          jq -n \
            --arg name "${{ matrix.name }}" \
            --arg image "$image" \
            --arg version "$version" \
            --arg tag "${{ steps.version.outputs.tag }}" \
            --arg digest "$digest" \
            --arg amd64 "$amd64" \
            --arg arm64 "$arm64" \
            '{name: $name, image: $image, version: $version, tag: $tag, digest: $digest, platforms: {"linux/amd64": $amd64, "linux/arm64": $arm64}}' \
            > "artifacts/image-${{ matrix.name }}.json"
          {
            echo "$digest  $image:$version"
            echo "$amd64  $image:$version (linux/amd64)"
            echo "$arm64  $image:$version (linux/arm64)"
          } > "artifacts/checksums-${{ matrix.name }}.txt"

      - name: Upload image records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: warn

  attest:
    name: Attest ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: images
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
          - name: scanner
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.name }}
          path: artifacts

      - name: Read image record
        id: record
        run: |
          jq -r '"image=" + .image,
                 "digest=" + .digest,
                 "version=" + .version,
                 "tag=" + .tag,
                 "amd64=" + .platforms["linux/amd64"],
                 "arm64=" + .platforms["linux/arm64"]' \
            "artifacts/image-${{ matrix.name }}.json" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Provenance covers the multi-arch index, so `gh attestation verify` with
      # the image tag verifies it. The SBOMs are per platform and are attested
      # against the platform digest listed in the release checksums.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.record.outputs.image }}
          subject-digest: ${{ steps.record.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.record.outputs.image }}
          subject-digest: ${{ steps.record.outputs.amd64 }}
          sbom-path: artifacts/sbom-${{ matrix.name }}-amd64.cdx.json
          push-to-registry: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.record.outputs.image }}
          subject-digest: ${{ steps.record.outputs.arm64 }}
          sbom-path: artifacts/sbom-${{ matrix.name }}-arm64.cdx.json
          push-to-registry: true

      # Only after every attestation succeeded. Pre-releases and rehearsals
      # keep only the exact version and sha tags.
      - name: Promote moving tags
        if: ${{ !contains(steps.record.outputs.version, '-') }}
        env:
          IMAGE: ${{ steps.record.outputs.image }}
          DIGEST: ${{ steps.record.outputs.digest }}
          VERSION: ${{ steps.record.outputs.version }}
        run: |
          major_minor="${VERSION%.*}"
          docker buildx imagetools create \
            -t "$IMAGE:$major_minor" \
            -t "$IMAGE:latest" \
            "$IMAGE@$DIGEST"

  release:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: attest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: artifacts
          merge-multiple: true

      - name: Build release assets
        shell: bash
        run: |
          cat artifacts/checksums-*.txt > artifacts/checksums.txt
          {
            echo "<!-- release-notes-placeholder -->"
            echo "Add the reviewed release notes from the release record here, unchanged."
            echo
            echo "## Release artifacts"
            echo
            echo "| Image | Tag | Digest |"
            echo "|---|---|---|"
            for record in artifacts/image-*.json; do
              jq -r '"| `\(.image)` | `\(.version)` | `\(.digest)` |"' "$record"
            done
            echo
            echo "### Platform digests"
            echo
            echo "| Image | Platform | Digest |"
            echo "|---|---|---|"
            for record in artifacts/image-*.json; do
              jq -r '. as $i | .platforms | to_entries[] | "| `\($i.image)` | `\(.key)` | `\(.value)` |"' "$record"
            done
            echo
            echo "The checksums file and one CycloneDX SBOM per image and platform are attached."
          } > artifacts/release-body.md

      # Create the draft only after the scan and attestations passed. The notes
      # stay a human step; publishing the draft is also a human step (REL-5).
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          title="$tag — Goodnight Check"
          repo="$GITHUB_REPOSITORY"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release $tag is already published; refusing to modify it." >&2
              exit 1
            fi
            if gh release view "$tag" --repo "$repo" --json body --jq .body | grep -q 'release-notes-placeholder'; then
              gh release edit "$tag" --repo "$repo" --title "$title" --notes-file artifacts/release-body.md
            fi
            gh release upload "$tag" --repo "$repo" --clobber artifacts/checksums.txt artifacts/sbom-*.json
          else
            gh release create "$tag" --repo "$repo" --draft --verify-tag \
              --title "$title" \
              --notes-file artifacts/release-body.md \
              artifacts/checksums.txt artifacts/sbom-*.json
          fi
